<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
</head>
<body>
    <ul class="todo-list">
        <li>
           <input type="checkbox"id="checkbox1"/> 
           <label for="checkbox1">Brush your teeth</label>
           <ul   class="sub-item">
               <li>
                   <a class="sub-item-link" target="_blank" href="https://www.cigna.com/knowledge-center/how-to-brush-teeth">How to brush your teeth proerly</a>
               </li>
           </ul>
        </li>
        <li>
           <input type="checkbox"id="checkbox2"/> 
           <label for="checkbox2">Make up the bed</label>
           <ul   class="sub-item">
               <li>
                   <a class="sub-item-link" target="_blank" href="https://www.marthastewart.com/8378417/how-to-make-your-bed">How to make the bed like a professional</a>
               </li>
           </ul>
        </li>
        <li>
           <input type="checkbox"id="checkbox3"/> 
           <label for="checkbox3">Daily exercise routine</label>
           <ul   class="sub-item">
               <li>
                   <a class="sub-item-link" target="_blank" href="https://www.healthline.com/health/fitness-exercise/10-best-exercises-everyday">Exercises to start the day</a>
               </li>
          </ul>
        </li>
        <li>
           <input type="checkbox"id="checkbox4"/> 
           <label for="checkbox4">Eat healthy breakfast</label>
           <ul   class="sub-item">
               <li>
                   <a class="sub-item-link" target="_blank" href="https://www.healthline.com/nutrition/12-best-foods-to-eat-in-morning">Healthy Breakfast</a>
               </li>
           </ul>
        </li>
    </ul>
</body>
</html>
