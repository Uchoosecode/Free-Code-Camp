<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Rubix cube">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Card Name</label>
            <input id="card-name" name="card-name" placeholder="Enter Cardholder Name" aria-required="true" required />
            <br>
            <label for="card-number">Card Number</label>
            <input id="card-number" name="card-number" placeholder="Enter Card Number" aria-required="true" required />
        </form>
    </section>
</body>
</html>
